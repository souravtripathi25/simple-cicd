name: Python CI

on:
  push:
    branches:
      - master

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          pip install flask
          pip install pytest

      - name: Run Tests
        run: pytest

      - name: Build Docker Image
        run: docker build -t souravtripathi/simple-cicd-app:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image
        run: docker push souravtripathi/simple-cicd-app:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull souravtripathi/simple-cicd-app:latest
            sudo docker stop simple-cicd-app || true
            sudo docker rm simple-cicd-app || true
            sudo docker run -d --name simple-cicd-app -p 80:5000 souravtripathi/simple-cicd-app:latest
